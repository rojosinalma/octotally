# Homelab instance: pinned GHCR release. Other users: see docker-compose.example.yml.
services:
  octotally:
    image: ghcr.io/rojosinalma/octotally:v0.1.0
    container_name: octotally
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - ingress
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  ingress:
    external: true
