name: Bug report
description: Something does not work as documented
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Remove any GitHub token or webhook URL from logs before pasting.
  - type: input
    id: version
    attributes:
      label: Octotally version
      description: From `GET /health` (`version`) or the image tag.
      placeholder: v0.3.1 / ghcr.io/rojosinalma/octotally:latest
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run it?
      options:
        - Docker image (ghcr.io)
        - Docker, built from source
        - bun run dev
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Active view
        2. Type `is:open -linked:pr`
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `docker logs octotally` lines (JSON). Secrets redacted.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Firefox 140 on Linux
